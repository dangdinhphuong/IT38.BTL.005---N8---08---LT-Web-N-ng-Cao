services:
  postgres:
    image: postgres:16-alpine
    container_name: couppa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: couppa
      POSTGRES_USER: couppa
      POSTGRES_PASSWORD: couppa_dev_password
    ports:
      - "5432:5432"
    volumes:
      - couppa_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U couppa -d couppa"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Couppa.Api/Dockerfile
    container_name: couppa-app
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_URLS: http://+:8080
    ports:
      - "5001:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  couppa_postgres_data:
