services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: couppa-mssql
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Couppa_dev_password1"
      MSSQL_PID: "Express"
    ports:
      - "1433:1433"
    volumes:
      - couppa_mssql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: Couppa.Api/Dockerfile
    container_name: couppa-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
    expose:
      - "8080"
    depends_on:
      mssql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/auth/csrf-token"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  web:
    build:
      context: ../html
      dockerfile: Dockerfile
    container_name: couppa-web
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - api

  caddy:
    image: caddy:2-alpine
    container_name: couppa-caddy
    restart: unless-stopped
    ports:
      - "5001:5001"
      - "5500:5500"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - couppa_caddy_data:/data
      - couppa_caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started

volumes:
  couppa_mssql_data:
  couppa_caddy_data:
  couppa_caddy_config:
