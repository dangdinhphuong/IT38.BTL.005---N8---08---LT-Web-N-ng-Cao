<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản Lý Người Dùng - Admin Couppa</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

  <div class="admin-wrapper">
    
    <!-- SIDEBAR -->
    <aside class="admin-sidebar">
      <div class="admin-sidebar-header">
        <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="margin-right: 8px;"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path></svg>
        Couppa Admin
      </div>

      <nav class="admin-menu">
        <a href="dashboard.html" class="admin-menu-item">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
          Dashboard
        </a>
        <a href="products.html" class="admin-menu-item">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path></svg>
          Quản Lý Sản Phẩm
        </a>
        <a href="categories.html" class="admin-menu-item">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 6h16M4 10h16M4 14h16M4 18h16"></path></svg>
          Quản Lý Danh Mục
        </a>
        <a href="users.html" class="admin-menu-item active">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"></path><circle cx="9" cy="7" r="4"></circle></svg>
          Quản Lý Người Dùng
        </a>
        <a href="reports.html" class="admin-menu-item">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
          Báo Cáo Thống Kê
        </a>
      </nav>

      <div style="margin-top: auto; padding: var(--space-4); border-top: 1px solid #1E293B;">
        <a href="../index.html" class="btn btn-outline btn-block btn-sm" style="color: #94A3B8; border-color: #334155;">&larr; Xem Website Public</a>
      </div>
    </aside>

    <!-- MAIN CONTENT -->
    <div class="admin-main">
      
      <header class="admin-topbar">
        <h3>Quản Lý Danh Sách Người Dùng</h3>
      </header>

      <main class="admin-content">
        
        <div class="data-table-container">
          <div class="table-toolbar">
            <div class="flex gap-4 items-center">
              <input type="text" id="user-search" class="form-input" placeholder="Tìm theo tên hoặc email..." style="width: 280px;">
              <select id="user-role-filter" class="form-select" style="width: 160px;">
                <option value="all">Tất cả Role</option>
                <option value="Admin">Admin</option>
                <option value="User">User</option>
              </select>
            </div>
            <span class="caption" id="user-count">Tổng số: 3 tài khoản</span>
          </div>

          <table class="data-table">
            <thead>
              <tr>
                <th>ID</th>
                <th>Họ và Tên</th>
                <th>Email</th>
                <th>Vai Trò (Role)</th>
                <th>Trạng Thái</th>
                <th style="text-align: right;">Thao Tác</th>
              </tr>
            </thead>
            <tbody id="user-table-body">
              <!-- Rendered via JS -->
            </tbody>
          </table>
        </div>

      </main>

    </div>
  </div>

  <script src="../js/apiClient.js"></script>
  <script src="../js/main.js"></script>
  <script>
    // RoleId gửi lên server phải là SỐ (ChangeUserRoleRequest.RoleId: short), khác với field
    // hiển thị (UserDetailResponse.Role: string "Admin"/"User"). 1 = User, 2 = Admin.
    const ROLE_ID = { User: 1, Admin: 2 };

    document.addEventListener('DOMContentLoaded', async () => {
      try {
        const me = await ApiClient.get('/users/me');
        if (me.role !== 'Admin') throw new Error('not admin');
      } catch (err) {
        CouppaApp.showToast('Cần quyền Admin!', 'error');
        setTimeout(() => window.location.href = '../login.html', 1000);
        return;
      }

      renderUsersTable();
      document.getElementById('user-search').addEventListener('input', renderUsersTable);
      document.getElementById('user-role-filter').addEventListener('change', renderUsersTable);
    });

    async function renderUsersTable() {
      const search = document.getElementById('user-search').value.trim();
      const roleFilter = document.getElementById('user-role-filter').value;

      const params = new URLSearchParams();
      if (search) params.set('search', search);
      if (roleFilter !== 'all') params.set('role', ROLE_ID[roleFilter]);

      let result;
      try {
        result = await ApiClient.get(`/admin/users?${params.toString()}`);
      } catch (err) {
        CouppaApp.showToast(CouppaApp.getErrorMessage(err), 'error');
        return;
      }

      document.getElementById('user-count').textContent = `Tổng số: ${result.totalItems} tài khoản`;

      const tbody = document.getElementById('user-table-body');
      // Hiển thị dùng u.role (string "Admin"/"User" từ UserDetailResponse) - giữ nguyên đúng
      // như bản gốc. Khi đổi role (xem toggleRole) mới cần convert sang RoleId số.
      tbody.innerHTML = result.items.map(u => `
        <tr>
          <td>${u.id}</td>
          <td style="font-weight: 600;">${CouppaApp.escapeHtml(u.fullName)}</td>
          <td><code>${CouppaApp.escapeHtml(u.email)}</code></td>
          <td>
            <button onclick="toggleRole(${u.id}, '${CouppaApp.escapeHtml(u.role)}')" class="badge ${u.role === 'Admin' ? 'badge-info' : 'badge-warning'}" style="border: none; cursor: pointer;" title="Bấm để đổi Role">
              ${CouppaApp.escapeHtml(u.role)}
            </button>
          </td>
          <td>
            <span class="badge ${u.isLocked ? 'badge-danger' : 'badge-success'}">
              ${u.isLocked ? 'Bị khóa' : 'Hoạt động'}
            </span>
          </td>
          <td style="text-align: right;">
            <button onclick="toggleLockUser(${u.id}, ${u.isLocked})" class="btn btn-outline btn-sm" style="${u.isLocked ? 'color: var(--color-success); border-color: var(--color-success);' : 'color: var(--color-error); border-color: var(--color-error-light);'}">
              ${u.isLocked ? 'Mở Khóa' : 'Khóa Tài Khoản'}
            </button>
          </td>
        </tr>
      `).join('');
    }

    async function toggleLockUser(userId, currentlyLocked) {
      try {
        const updated = await ApiClient.patch(`/admin/users/${userId}/lock`, { isLocked: !currentlyLocked });
        CouppaApp.showToast(`Đã ${updated.isLocked ? 'KHÓA' : 'MỞ KHÓA'} tài khoản ${updated.email} thành công!`, updated.isLocked ? 'warning' : 'success');
        renderUsersTable();
      } catch (err) {
        // 409 (BR-14): Admin tự khóa chính mình - để server xác nhận (so sánh theo user đăng
        // nhập thật trong session) thay vì tự chặn client-side dựa trên state cũ không tin cậy.
        CouppaApp.showToast(CouppaApp.getErrorMessage(err), 'error');
      }
    }

    // currentRole là string ("Admin"/"User") lấy từ UserDetailResponse.Role để hiển thị -
    // phải map sang RoleId dạng SỐ (ROLE_ID) trước khi gửi PATCH, vì ChangeUserRoleRequest.RoleId
    // là short, không nhận string.
    async function toggleRole(userId, currentRole) {
      const newRoleId = currentRole === 'Admin' ? ROLE_ID.User : ROLE_ID.Admin;
      try {
        const updated = await ApiClient.patch(`/admin/users/${userId}/role`, { roleId: newRoleId });
        CouppaApp.showToast(`Đã thay đổi Role của ${updated.email} thành ${updated.role}`, 'info');
        renderUsersTable();
      } catch (err) {
        CouppaApp.showToast(CouppaApp.getErrorMessage(err), 'error');
      }
    }
  </script>
</body>
</html>
